<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f97316">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Filaments">
    <title>Filament Tracker</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --orange: #f97316;
            --amber: #f59e0b;
            --bg: #fff9f0;
            --card: #ffffff;
            --text: #431407;
            --muted: #a8825a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* ── Header ── */
        header {
            background: linear-gradient(135deg, #f97316 0%, #f59e0b 100%);
            color: white;
            padding: 20px 18px 16px;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(249,115,22,0.35);
        }

        header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.3px; }
        header p  { font-size: 13px; opacity: 0.85; margin-top: 3px; font-weight: 500; }

        /* ── Filter bar ── */
        .filter-bar {
            display: flex;
            gap: 8px;
            padding: 14px 16px 0;
            max-width: 480px;
            margin: 0 auto;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar { display: none; }

        .chip {
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid #ffe4cc;
            background: white;
            font-size: 13px; font-weight: 700;
            color: var(--muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .chip.active { background: var(--orange); border-color: var(--orange); color: white; }

        /* ── Container ── */
        .container { max-width: 480px; margin: 0 auto; padding: 14px 16px; }

        /* ── Summary card ── */
        .summary {
            background: white;
            border-radius: 20px;
            padding: 16px 18px;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(249,115,22,0.1);
            display: flex;
            gap: 0;
        }

        .stat {
            flex: 1;
            text-align: center;
        }

        .stat + .stat {
            border-left: 1.5px solid #fff0e6;
        }

        .stat .val { font-size: 22px; font-weight: 800; color: var(--orange); }
        .stat .lbl { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 2px; }

        /* ── Spool cards ── */
        .spool-card {
            background: var(--card);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(249,115,22,0.08);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            border-left: 5px solid #ccc;
        }

        .spool-card:active { transform: scale(0.98); box-shadow: 0 1px 6px rgba(0,0,0,0.08); }

        .spool-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .spool-icon {
            width: 50px; height: 50px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            border: 3px solid rgba(0,0,0,0.08);
        }

        .spool-info { flex: 1; min-width: 0; }

        .spool-brand {
            font-size: 16px; font-weight: 800; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .spool-sub {
            display: flex; align-items: center; gap: 6px; margin-top: 4px;
        }

        .type-badge {
            font-size: 11px; font-weight: 700;
            padding: 2px 8px; border-radius: 8px;
            color: white;
        }

        .spool-color-name { font-size: 12px; color: var(--muted); font-weight: 500; }

        .spool-weight {
            text-align: right;
            flex-shrink: 0;
        }

        .spool-weight .grams { font-size: 18px; font-weight: 800; color: var(--text); }
        .spool-weight .unit  { font-size: 11px; color: var(--muted); font-weight: 600; }
        .spool-weight .pct   { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 1px; }

        /* Progress bar */
        .prog-track {
            height: 7px;
            background: #f3f4f6;
            border-radius: 4px;
            overflow: hidden;
        }

        .prog-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        /* ── Empty state ── */
        .empty {
            text-align: center;
            padding: 60px 16px;
            color: var(--muted);
        }

        .empty .icon { font-size: 64px; margin-bottom: 16px; display: block; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
        .empty p { font-size: 16px; line-height: 1.6; color: #d4a47a; }

        /* ── FAB ── */
        .fab {
            position: fixed;
            bottom: 30px; right: 22px;
            width: 60px; height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f97316, #f59e0b);
            color: white;
            border: none;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(249,115,22,0.5);
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
            transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
        }

        .fab:active { transform: scale(0.88); }

        /* ── Modal ── */
        .overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(67,20,7,0.3);
            backdrop-filter: blur(4px);
            z-index: 200;
            align-items: flex-end;
            justify-content: center;
        }

        .overlay.open { display: flex; }

        .modal {
            background: white;
            border-radius: 28px 28px 0 0;
            padding: 10px 22px 48px;
            width: 100%;
            max-width: 480px;
            animation: slideUp 0.28s cubic-bezier(0.34,1.3,0.64,1);
            max-height: 92vh;
            overflow-y: auto;
        }

        @keyframes slideUp { from{transform:translateY(110%)} to{transform:translateY(0)} }

        .modal-handle {
            width: 36px; height: 4px;
            background: #ffe4cc;
            border-radius: 2px;
            margin: 14px auto 20px;
        }

        .modal h2 { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 20px; }

        .field { margin-bottom: 15px; }

        .field label {
            display: block;
            font-size: 12px; font-weight: 700;
            color: var(--muted);
            text-transform: uppercase; letter-spacing: 0.6px;
            margin-bottom: 7px;
        }

        .field input, .field select {
            width: 100%;
            padding: 13px 14px;
            border: 2px solid #ffe4cc;
            border-radius: 14px;
            font-size: 16px;
            color: var(--text);
            background: #fff9f5;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            appearance: none;
        }

        .field input:focus, .field select:focus {
            border-color: var(--orange);
            box-shadow: 0 0 0 4px rgba(249,115,22,0.12);
        }

        .field-row { display: flex; gap: 10px; }
        .field-row .field { flex: 1; }

        .color-row {
            display: flex; gap: 10px; align-items: flex-end;
        }

        .color-row .field { flex: 1; }

        .color-preview {
            width: 52px; height: 52px;
            border-radius: 14px;
            border: 2px solid #ffe4cc;
            flex-shrink: 0;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }

        .color-preview input[type="color"] {
            position: absolute; inset: -4px;
            width: calc(100% + 8px); height: calc(100% + 8px);
            border: none; padding: 0; cursor: pointer; opacity: 0;
        }

        .btn-save {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #f97316, #f59e0b);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px; font-weight: 800;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 14px rgba(249,115,22,0.4);
            transition: transform 0.15s;
        }

        .btn-save:active { transform: scale(0.97); }

        .btn-delete-modal {
            width: 100%;
            padding: 13px;
            background: transparent;
            color: #fb7185;
            border: none;
            font-size: 15px; font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
        }

        .btn-cancel {
            width: 100%;
            padding: 13px;
            background: transparent;
            color: var(--muted);
            border: none;
            font-size: 15px; font-weight: 600;
            cursor: pointer;
            margin-top: 2px;
        }

        /* ── New spool toggle ── */
        .new-toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fff9f0;
            border: 2px solid #ffe4cc;
            border-radius: 14px;
            padding: 13px 16px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }
        .new-toggle.on { background: #fef3c7; border-color: #f59e0b; }
        .new-toggle-label { flex: 1; font-size: 15px; font-weight: 700; color: var(--text); }
        .new-toggle-label small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-top: 1px; }

        .toggle-switch {
            width: 44px; height: 26px;
            background: #e5e7eb;
            border-radius: 13px;
            position: relative;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 3px; left: 3px;
            width: 20px; height: 20px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .new-toggle.on .toggle-switch { background: #f59e0b; }
        .new-toggle.on .toggle-switch::after { transform: translateX(18px); }

        /* ── New spool card badge ── */
        .new-badge {
            display: inline-flex; align-items: center; gap: 4px;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            color: #92400e;
            font-size: 11px; font-weight: 800;
            padding: 3px 10px; border-radius: 8px;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <header>
        <h1>🧵 Filament Tracker</h1>
        <p id="hdr-sub">Loading…</p>
    </header>

    <div class="filter-bar" id="filter-bar"></div>

    <div class="container">
        <div class="summary" id="summary"></div>
        <div id="list"></div>
    </div>

    <button class="fab" onclick="openAdd()">+</button>

    <div class="overlay" id="overlay" onclick="overlayClick(event)">
        <div class="modal" id="modal">
            <div class="modal-handle"></div>
            <h2 id="modal-title">Add Spool ✨</h2>

            <div class="field">
                <label>Brand *</label>
                <input id="f-brand" type="text" list="brand-list" placeholder="e.g. Bambu, Prusament, Hatchbox" autocomplete="off">
                <datalist id="brand-list"></datalist>
            </div>

            <div class="field-row">
                <div class="field">
                    <label>Type *</label>
                    <input id="f-type" type="text" list="type-list" placeholder="PLA, PETG, ABS…" autocomplete="off">
                    <datalist id="type-list">
                        <option value="PLA">
                        <option value="PLA+">
                        <option value="PETG">
                        <option value="ABS">
                        <option value="ASA">
                        <option value="TPU">
                        <option value="Nylon">
                        <option value="Resin">
                        <option value="PEEK">
                        <option value="PC">
                    </datalist>
                </div>
                <div class="field">
                    <label>Diameter</label>
                    <select id="f-diameter">
                        <option value="1.75mm">1.75mm</option>
                        <option value="2.85mm">2.85mm</option>
                    </select>
                </div>
            </div>

            <div class="color-row">
                <div class="field" style="flex:1">
                    <label>Color Name</label>
                    <input id="f-color-name" type="text" placeholder="e.g. Galaxy Black">
                </div>
                <div class="color-preview" id="color-preview" style="background:#e2e8f0" title="Pick color">
                    <input type="color" id="f-color" value="#e2e8f0" oninput="updateColorPreview()">
                </div>
            </div>

            <div class="new-toggle" id="new-toggle" onclick="toggleNew()">
                <div class="new-toggle-label">
                    🎁 New spool
                    <small>Still sealed — quantity unknown</small>
                </div>
                <div class="toggle-switch"></div>
            </div>

            <div id="weight-fields">
                <div class="field-row">
                    <div class="field">
                        <label>Total (g)</label>
                        <input id="f-total" type="number" placeholder="1000" min="0" max="10000">
                    </div>
                    <div class="field">
                        <label>Remaining (g) *</label>
                        <input id="f-remaining" type="number" placeholder="750" min="0" max="10000">
                    </div>
                </div>
            </div>

            <div class="field">
                <label>Notes (optional)</label>
                <input id="f-notes" type="text" placeholder="e.g. Needs 220°C, great layer adhesion">
            </div>

            <button class="btn-save" id="btn-save" onclick="saveSpool()">Add Spool</button>
            <button class="btn-delete-modal" id="btn-delete" style="display:none" onclick="deleteSpool()">Delete Spool</button>
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        const TYPE_COLORS = {
            'PLA':   '#22c55e',
            'PLA+':  '#10b981',
            'PETG':  '#3b82f6',
            'ABS':   '#ef4444',
            'ASA':   '#f97316',
            'TPU':   '#a855f7',
            'Nylon': '#eab308',
            'Resin': '#06b6d4',
            'Other': '#6b7280',
        };

        const TYPE_EMOJIS = {
            'PLA': '🟢', 'PLA+': '🟩', 'PETG': '🔵', 'ABS': '🔴',
            'ASA': '🟠', 'TPU':  '🟣', 'Nylon':'🟡', 'Resin':'🔷', 'Other':'⚪',
        };

        let spools = JSON.parse(localStorage.getItem('spools') || '[]');
        let activeFilter = 'All';
        let editingId = null;

        // -- render --
        function render() {
            // update header subtitle
            const totalG = spools.reduce((s, p) => s + (p.isNew ? 0 : (p.remaining || 0)), 0);
            const newCount = spools.filter(s => s.isNew).length;
            document.getElementById('hdr-sub').textContent =
                spools.length ? `${spools.length} spool${spools.length !== 1 ? 's' : ''}${newCount ? ' · ' + newCount + ' sealed' : ''} · ${(totalG/1000).toFixed(2)} kg remaining` : 'No spools yet';

            // filter chips
            const types = ['All', ...new Set(spools.map(s => s.type))];
            document.getElementById('filter-bar').innerHTML = types.map(t =>
                `<div class="chip ${t === activeFilter ? 'active' : ''}" onclick="setFilter('${t}')">${t}</div>`
            ).join('');

            // summary
            const totalSpools = spools.length;
            const lowSpools = spools.filter(s => !s.isNew && pct(s) < 25).length;
            const totalKg = (totalG / 1000).toFixed(2);
            document.getElementById('summary').innerHTML = `
                <div class="stat"><div class="val">${totalSpools}</div><div class="lbl">Spools</div></div>
                <div class="stat"><div class="val">${totalKg}</div><div class="lbl">kg left</div></div>
                <div class="stat"><div class="val" style="color:${lowSpools ? '#fb7185' : '#22c55e'}">${lowSpools}</div><div class="lbl">Running low</div></div>
            `;

            // list
            const filtered = activeFilter === 'All' ? spools : spools.filter(s => s.type === activeFilter);
            const el = document.getElementById('list');

            if (!spools.length) {
                el.innerHTML = `<div class="empty"><span class="icon">🧵</span><p>No spools added yet.<br>Tap <strong>+</strong> to add your first filament!</p></div>`;
                return;
            }

            if (!filtered.length) {
                el.innerHTML = `<div class="empty"><span class="icon">🔍</span><p>No ${activeFilter} spools found.</p></div>`;
                return;
            }

            const sorted = [...filtered].sort((a, b) => {
                if (a.isNew && !b.isNew) return -1;
                if (!a.isNew && b.isNew) return 1;
                return pct(a) - pct(b);
            });
            el.innerHTML = sorted.map(s => {
                const p = pct(s);
                const typeColor = TYPE_COLORS[s.type] || '#6b7280';
                const barColor = s.isNew ? '#f59e0b' : p < 15 ? '#fb7185' : p < 35 ? '#fbbf24' : typeColor;
                const weightHtml = s.isNew
                    ? `<div class="new-badge">🎁 NEW</div>`
                    : `<div class="grams">${s.remaining ?? '?'}</div><div class="unit">grams</div><div class="pct">${s.total ? p + '%' : ''}</div>`;
                return `
                <div class="spool-card" style="border-left-color:${s.color || '#e2e8f0'}" onclick="openEdit('${s.id}')">
                    <div class="spool-top">
                        <div class="spool-icon" style="background:${s.color || '#e2e8f0'}20; border-color:${s.color || '#e2e8f0'}40">
                            ${TYPE_EMOJIS[s.type] || '⚪'}
                        </div>
                        <div class="spool-info">
                            <div class="spool-brand">${esc(s.brand)}</div>
                            <div class="spool-sub">
                                <span class="type-badge" style="background:${typeColor}">${esc(s.type)}</span>
                                <span class="spool-color-name">${s.diameter ? esc(s.diameter) + ' · ' : ''}${s.colorName ? esc(s.colorName) : ''}</span>
                            </div>
                        </div>
                        <div class="spool-weight">${weightHtml}</div>
                    </div>
                    <div class="prog-track">
                        <div class="prog-fill" style="width:${s.isNew ? 100 : (s.total ? p : 50)}%;background:${barColor}"></div>
                    </div>
                    ${s.notes ? `<div style="font-size:12px;color:var(--muted);margin-top:8px">📝 ${esc(s.notes)}</div>` : ''}
                </div>`;
            }).join('');
        }

        function pct(s) {
            if (s.isNew) return 100;
            if (!s.total || !s.remaining) return 0;
            return Math.round((s.remaining / s.total) * 100);
        }

        function esc(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function setFilter(t) { activeFilter = t; render(); }

        // -- new toggle --
        let isNewSpool = false;

        function toggleNew() {
            isNewSpool = !isNewSpool;
            document.getElementById('new-toggle').classList.toggle('on', isNewSpool);
            document.getElementById('weight-fields').style.display = isNewSpool ? 'none' : 'block';
        }

        function setNewState(val) {
            isNewSpool = val;
            document.getElementById('new-toggle').classList.toggle('on', val);
            document.getElementById('weight-fields').style.display = val ? 'none' : 'block';
        }

        function refreshBrandList() {
            const brands = [...new Set(spools.map(s => s.brand).filter(Boolean))];
            document.getElementById('brand-list').innerHTML = brands.map(b => `<option value="${esc(b)}">`).join('');
        }

        // -- modal --
        function openAdd() {
            editingId = null;
            document.getElementById('modal-title').textContent = 'Add Spool ✨';
            document.getElementById('btn-save').textContent = 'Add Spool';
            document.getElementById('btn-delete').style.display = 'none';
            ['f-brand','f-color-name','f-notes'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('f-type').value = 'PLA';
            document.getElementById('f-diameter').value = '1.75mm';
            document.getElementById('f-total').value = '1000';
            document.getElementById('f-remaining').value = '';
            document.getElementById('f-color').value = '#e2e8f0';
            document.getElementById('color-preview').style.background = '#e2e8f0';
            setNewState(false);
            refreshBrandList();
            document.getElementById('overlay').classList.add('open');
            setTimeout(() => document.getElementById('f-brand').focus(), 100);
        }

        function openEdit(id) {
            const s = spools.find(x => x.id === id);
            if (!s) return;
            editingId = id;
            document.getElementById('modal-title').textContent = 'Edit Spool ✏️';
            document.getElementById('btn-save').textContent = 'Save Changes';
            document.getElementById('btn-delete').style.display = 'block';
            document.getElementById('f-brand').value = s.brand || '';
            document.getElementById('f-type').value = s.type || 'PLA';
            document.getElementById('f-diameter').value = s.diameter || '1.75mm';
            document.getElementById('f-color-name').value = s.colorName || '';
            document.getElementById('f-color').value = s.color || '#e2e8f0';
            document.getElementById('color-preview').style.background = s.color || '#e2e8f0';
            document.getElementById('f-total').value = s.total || '';
            document.getElementById('f-remaining').value = s.remaining ?? '';
            document.getElementById('f-notes').value = s.notes || '';
            setNewState(!!s.isNew);
            refreshBrandList();
            document.getElementById('overlay').classList.add('open');
        }

        function closeModal() {
            document.getElementById('overlay').classList.remove('open');
            editingId = null;
        }

        function overlayClick(e) { if (e.target === e.currentTarget) closeModal(); }

        function updateColorPreview() {
            const c = document.getElementById('f-color').value;
            document.getElementById('color-preview').style.background = c;
        }

        function saveSpool() {
            const brand = document.getElementById('f-brand').value.trim();
            if (!brand) { alert('Please enter a brand.'); return; }

            const remaining = isNewSpool ? null : parseFloat(document.getElementById('f-remaining').value);
            if (!isNewSpool && isNaN(remaining)) { alert('Please enter the remaining amount in grams.'); return; }

            const data = {
                brand,
                type:      document.getElementById('f-type').value.trim() || 'Other',
                diameter:  document.getElementById('f-diameter').value,
                colorName: document.getElementById('f-color-name').value.trim(),
                color:     document.getElementById('f-color').value,
                total:     isNewSpool ? null : (parseFloat(document.getElementById('f-total').value) || null),
                remaining,
                isNew:     isNewSpool,
                notes:     document.getElementById('f-notes').value.trim(),
            };

            if (editingId) {
                const i = spools.findIndex(s => s.id === editingId);
                if (i >= 0) spools[i] = { ...spools[i], ...data };
            } else {
                spools.push({ id: Date.now().toString(36), ...data });
            }

            localStorage.setItem('spools', JSON.stringify(spools));
            closeModal();
            render();
        }

        function deleteSpool() {
            if (!editingId) return;
            if (!confirm('Delete this spool?')) return;
            spools = spools.filter(s => s.id !== editingId);
            localStorage.setItem('spools', JSON.stringify(spools));
            closeModal();
            render();
        }

        render();
    </script>
</body>
</html>
